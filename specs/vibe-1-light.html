<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Vibe 1 — Light / Clean</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f4f2ec;color:#1a1a1a;font-family:"Inter","Helvetica Neue",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hint{position:fixed;bottom:12px;left:12px;font:11px/1.4 monospace;color:#666;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div class="hint">Vibe 1 · Light/Clean · drag to orbit · click dots · 1/2/3/4 stages</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
const stages=['BUILD','SCULPT','RIG','MARIONETTE'];
let si=0,yaw=-0.6,pitch=0.3,zoom=1,time=0;
const bodies=['Spinous 4 arch','Lumbar 5 body','Rib 7 L','Humerus R','Femur L','Hose elbow L','Rotor bolt R1'];
let sel=2,filter='',scroll=0;
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4')si=+e.key-1;if(e.key==='Escape')filter='';if(/^[a-z ]$/i.test(e.key)&&e.key.length===1)filter+=e.key;if(e.key==='Backspace')filter=filter.slice(0,-1)});
addEventListener('wheel',e=>{e.preventDefault();if(e.target===c)zoom=Math.max(.4,Math.min(2.5,zoom*(e.deltaY<0?1.08:.93)))},{passive:false});
let drag=false,lx,ly;addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(drag){yaw+=(e.clientX-lx)*.006;pitch=Math.max(-1.1,Math.min(1.1,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY}});
function project(x,y,z){const rx=x,ry=y,rz=z;const cY=Math.cos(yaw),sY=Math.sin(yaw),cP=Math.cos(pitch),sP=Math.sin(pitch);const x1=rx*cY-ry*sY,y1=rx*sY+ry*cY,y2=y1*cP-rz*sP,z2=y1*sP+rz*cP;const dist=Math.max(60,520/zoom+y2*.4);const fov=520/dist;return{x:W*.5+x1*.0022*W*fov,y:H*.42-z2*.0022*W*fov}}
function draw(){
  time+=.016;ctx.fillStyle='#f4f2ec';ctx.fillRect(0,0,W,H);
  // soft grid floor
  ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=1;
  for(let i=-6;i<=6;i++){const a=project(i*40,0,-60),b=project(i*40,0,60);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();const c2=project(-60,0,i*20?0:0),d=project(60,0,i*20?0:0);}
  // model (rings)
  const rings=[{x:-90,r:24},{x:-50,r:30},{x:0,r:28},{x:50,r:22},{x:90,r:16}];
  rings.forEach((rg,ri)=>{
    const pts=[];for(let s=0;s<12;s++){const a=s/12*Math.PI*2;const p=project(rg.x,Math.cos(a)*rg.r,Math.sin(a)*rg.r);pts.push(p)}
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
    ctx.fillStyle=ri%2?'#d8d4c8':'#c9c5b9';ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;ctx.stroke();
  });
  // stage switcher (clean segmented control, not a turret)
  const sw=320,sh=34,sx=W*.5-sw/2,sy=24;
  ctx.fillStyle='#ffffff';ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1;
  roundRect(sx,sy,sw,sh,8);ctx.fill();ctx.stroke();
  stages.forEach((st,i)=>{
    const bx=sx+i*(sw/4),bw=sw/4;
    if(i===si){ctx.fillStyle='#1a1a1a';roundRect(bx+2,sy+2,bw-4,sh-4,6);ctx.fill();ctx.fillStyle='#fff'}else ctx.fillStyle='#555';
    ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(st,bx+bw/2,sy+sh/2);
  });
  // body index (clean column, right side) - 2-3 instruments max: this + tape
  const ix=W-260,iy=80,iw=240,ih=H-160;
  ctx.fillStyle='#ffffff';ctx.strokeStyle='rgba(0,0,0,.1)';ctx.lineWidth=1;roundRect(ix,iy,iw,ih,10);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1a1a1a';ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('Bodies',ix+16,iy+14);
  ctx.fillStyle='#888';ctx.font='10px sans-serif';ctx.fillText(filter?'/'+filter:'/'+bodies.length+' total',ix+16,iy+32);
  // search underline
  ctx.strokeStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.moveTo(ix+16,iy+50);ctx.lineTo(ix+iw-16,iy+50);ctx.stroke();
  const filt=filter.toLowerCase();
  let yy=iy+58-scroll;
  ctx.font='11px sans-serif';
  bodies.filter(b=>!filt||b.toLowerCase().includes(filt)).forEach((b,i)=>{
    if(yy>iy+58&&yy<iy+ih-10){
      const active=b===bodies[sel];
      if(active){ctx.fillStyle='#eef2ff';roundRect(ix+8,yy-2,iw-16,20,4);ctx.fill()}
      ctx.fillStyle=active?'#2563eb':'#333';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(b,ix+16,yy+8);
    }
    yy+=22;
  });
  // history tape (bottom) - horizontal, minimal
  const tx=40,ty=H-70,tw=W-80;
  ctx.fillStyle='#ffffff';ctx.strokeStyle='rgba(0,0,0,.1)';ctx.lineWidth=1;roundRect(tx,ty,tw,40,8);ctx.fill();ctx.stroke();
  const notches=['Hull','Lod','Intake','Fan','Bridge','Mirror'];
  notches.forEach((n,i)=>{
    const nx=tx+20+i*(tw-40)/(notches.length-1);
    ctx.beginPath();ctx.arc(nx,ty+20,5,0,Math.PI*2);ctx.fillStyle=i===2?'#2563eb':'#bbb';ctx.fill();
    ctx.fillStyle='#555';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(n,nx,ty+28);
  });
  // playhead
  ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx+tw*.4,ty+4);ctx.lineTo(tx+tw*.4,ty+36);ctx.stroke();
  requestAnimationFrame(draw);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
draw();
</script></body></html>
