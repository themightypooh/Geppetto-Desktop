<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Geppetto Desktop — Fluid Blobs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03040a;color:#fff;font-family:monospace;overflow:hidden;cursor:crosshair}
canvas{display:block;width:100%;height:100%}
.whisper{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font:10px/1.4 monospace;letter-spacing:1.5px;color:rgba(255,255,255,.35);pointer-events:none;text-transform:uppercase;text-align:center}
</style></head><body>
<canvas id="c"></canvas><div class="whisper">gloopy · drag blobs · they merge & split · click to select · space play</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();

// offscreen for metaball field
const off=document.createElement('canvas');let ow,oh;
function resizeOff(){ow=Math.floor(W/2);oh=Math.floor(H/2);off.width=ow;off.height=oh}
resizeOff();addEventListener('resize',resizeOff);
const octx=off.getContext('2d');

const modes=[
 {id:'build',name:'BUILD',accent:'#6fa8ff'},
 {id:'sculpt',name:'SCULPT',accent:'#ff9a6a'},
 {id:'rig',name:'RIG',accent:'#6affd6'},
 {id:'marionette',name:'MARIONETTE',accent:'#d6a8ff'}
];
let mi=0,time=0,playing=true,playhead=.35;

// blobs: dynamic, reacting
// each blob: x,y,vx,vy,r,baseR,label,color,mode,selected,pinned
const blobs=[];
function spawnBlob(x,y,r,label,color,mode,pinned=false){
 blobs.push({x,y,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r,baseR:r,label,color,mode,selected:false,pinned,grabbed:false});
}
// initial tools
const toolDefs=[
 {name:'HULL',mode:'build',r:34},{name:'LOD',mode:'build',r:26},{name:'POLY',mode:'build',r:30},
 {name:'PAINT',mode:'sculpt',r:32},{name:'BRUSH',mode:'sculpt',r:28},{name:'UV',mode:'sculpt',r:24},
 {name:'RIG',mode:'rig',r:34},{name:'IK',mode:'rig',r:26},
 {name:'PLAY',mode:'marionette',r:30},{name:'KEY',mode:'marionette',r:24},{name:'CURVE',mode:'marionette',r:28}
];
const accentFor={build:'#6fa8ff',sculpt:'#ff9a6a',rig:'#6affd6',marionette:'#d6a8ff'};
toolDefs.forEach((t,i)=>{
 const ang=i/toolDefs.length*Math.PI*2;
 spawnBlob(W/2+Math.cos(ang)*220, H/2+Math.sin(ang)*140, t.r, t.name, accentFor[t.mode], t.mode);
});

// mouse attractor blob
const mouse={x:W/2,y:H/2,down:false,grabbed:null};

addEventListener('mousedown',e=>{
 mouse.x=e.clientX;mouse.y=e.clientY;mouse.down=true;
 // find nearest blob
 let best=null,bestD=60;
 blobs.forEach(b=>{const d=Math.hypot(b.x-e.clientX,b.y-e.clientY);if(d<bestD){bestD=d;best=b}});
 if(best){best.grabbed=true;mouse.grabbed=best}
});
addEventListener('mouseup',()=>{mouse.down=false;if(mouse.grabbed){mouse.grabbed.grabbed=false;mouse.grabbed=null}});
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('wheel',e=>{e.preventDefault()}, {passive:false});
addEventListener('keydown',e=>{
 if(e.key>='1'&&e.key<='4'){const idx=+e.key-1;mi=idx}
 if(e.code==='Space')playing=!playing;
});

function stepBlobs(dt){
 // physics: blobs attract to mouse when down, repel slightly, merge when close, spring back to orbit
 const st=modes[mi];
 const cx=W/2,cy=H/2;
 blobs.forEach(b=>{
  // mode visibility: blobs of other modes shrink and fade (but stay)
  const active=b.mode===st.id;
  const targetR=active?b.baseR:b.baseR*.55;
  b.r+=(targetR-b.r)*.08;
  if(b.grabbed){
   b.x+=(mouse.x-b.x)*.35;b.y+=(mouse.y-b.y)*.35;b.vx*=.5;b.vy*=.5;return;
  }
  // gentle orbit around center for active mode blobs
  if(active){
   const ang=Math.atan2(b.y-cy,b.x-cx);
   const rad=Math.hypot(b.x-cx,b.y-cy);
   const targetRad=200;
   const ra=rad-targetRad;
   b.vx-=Math.cos(ang)*ra*.0008;b.vy-=Math.sin(ang)*ra*.0008;
   // tangential drift
   b.vx+=-Math.sin(ang)*.02;b.vy+=Math.cos(ang)*.02;
  } else {
   // inactive: drift toward center slowly, shrink
   b.vx+=(cx-b.x)*.0003;b.vy+=(cy-b.y)*.0003;
  }
  // mouse repulsion/attraction
  if(mouse.down && !mouse.grabbed){
   const d=Math.hypot(b.x-mouse.x,b.y-mouse.y);
   if(d<180){const f=(180-d)/180*.4;b.vx+=(mouse.x-b.x)/d*f;b.vy+=(mouse.y-b.y)/d*f}
  }
  // inter-blob repulsion (so they don't fully overlap)
  blobs.forEach(o=>{if(o===b)return;const d=Math.hypot(b.x-o.x,b.y-o.y);const minD=b.r+o.r-6;if(d<minD&&d>0){const f=(minD-d)/minD*.6;b.vx-=(o.x-b.x)/d*f;b.vy-=(o.y-b.y)/d*f}});
  // damping
  b.vx*=.92;b.vy*=.92;
  // integrate
  b.x+=b.vx;b.y+=b.vy;
  // bounds
  if(b.x<40){b.x=40;b.vx=Math.abs(b.vx)}
  if(b.x>W-40){b.x=W-40;b.vx=-Math.abs(b.vx)}
  if(b.y<40){b.y=40;b.vy=Math.abs(b.vy)}
  if(b.y>H-40){b.y=H-40;b.vy=-Math.abs(b.vy)}
 });
}

function renderMetaballs(){
 // draw field
 octx.clearRect(0,0,ow,oh);
 octx.globalCompositeOperation='lighter';
 blobs.forEach(b=>{
  const x=b.x/2,y=b.y/2,r=b.r/2;
  const g=octx.createRadialGradient(x,y,0,x,y,r*2.2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.4,'rgba(255,255,255,.6)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  octx.fillStyle=g;
  octx.beginPath();octx.arc(x,y,r*2.2,0,Math.PI*2);octx.fill();
 });
 octx.globalCompositeOperation='source-over';
 // threshold
 const img=octx.getImageData(0,0,ow,oh);
 const data=img.data;
 const threshold=110;
 for(let i=0;i<data.length;i+=4){
  const v=data[i]; // red channel
  if(v>threshold){data[i]=255;data[i+1]=255;data[i+2]=255;data[i+3]=255}
  else {data[i]=0;data[i+1]=0;data[i+2]=0;data[i+3]=0}
 }
 octx.putImageData(img,0,0);
}

function draw(){
 time+=.016;stepBlobs(.016);
 const st=modes[mi];
 // bg
 ctx.fillStyle='#03040a';ctx.fillRect(0,0,W,H);

 // render metaball silhouette to main canvas (scaled up)
 renderMetaballs();
 // colorize: draw the offscreen as alpha mask with accent color
 ctx.save();
 ctx.globalCompositeOperation='source-over';
 // draw colored blobs using the mask
 // approach: draw offscreen scaled, then multiply color
 const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tctx=tmp.getContext('2d');
 tctx.imageSmoothingEnabled=true;
 tctx.drawImage(off,0,0,W,H);
 // now colorize pixels
 const img=tctx.getImageData(0,0,W,H);
 const d=img.data;
 const ac=st.accent;
 const r0=parseInt(ac.slice(1,3),16),g0=parseInt(ac.slice(3,5),16),b0=parseInt(ac.slice(5,7),16);
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]>128){d[i]=r0;d[i+1]=g0;d[i+2]=b0;d[i+3]=200}
  else d[i+3]=0;
 }
 tctx.putImageData(img,0,0);
 ctx.drawImage(tmp,0,0);
 ctx.restore();

 // glow
 ctx.save();ctx.globalCompositeOperation='lighter';
 ctx.filter='blur(12px)';
 ctx.drawImage(tmp,0,0);
 ctx.filter='none';
 ctx.restore();

 // labels on blobs
 ctx.textAlign='center';ctx.textBaseline='middle';
 blobs.forEach(b=>{
  if(b.r<8)return;
  const active=b.mode===st.id;
  ctx.fillStyle=active?'#03040a':'rgba(255,255,255,.7)';
  ctx.font='bold '+(Math.max(9,b.r*.35))+'px monospace';
  ctx.fillText(b.label,b.x,b.y);
  if(b.grabbed){
   ctx.strokeStyle=st.accent;ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r+6,0,Math.PI*2);ctx.stroke();
  }
 });

 // mode indicator
 ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='10px monospace';ctx.textAlign='center';ctx.textBaseline='top';
 ctx.fillText(st.id.toUpperCase()+'  ·  1-4 modes',W/2,18);

 // playhead (small, bottom)
 if(playing)playhead=(playhead+.002)%1;
 ctx.strokeStyle=st.accent;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.3,H-24);ctx.lineTo(W*.7,H-24);ctx.stroke();
 ctx.beginPath();ctx.arc(W*.3+playhead*(W*.4),H-24,5,0,Math.PI*2);ctx.fillStyle=st.accent;ctx.fill();

 // whisper
 ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='9px monospace';ctx.textAlign='center';ctx.textBaseline='bottom';
 ctx.fillText('gloopy blobs · drag to merge · they react to you',W/2,H-8);

 requestAnimationFrame(draw);
}
draw();
</script></body></html>
