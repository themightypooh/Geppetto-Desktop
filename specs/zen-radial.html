<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Geppetto Desktop — Zen Radial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05080c;color:#fff;font-family:monospace;overflow:hidden;cursor:crosshair}
canvas{display:block;width:100%;height:100%}
.whisper{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font:10px/1.4 monospace;letter-spacing:1.5px;color:rgba(255,255,255,.35);pointer-events:none;text-transform:uppercase;text-align:center}
.card{position:fixed;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;font:11px monospace;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.6)}
</style></head><body>
<canvas id="c"></canvas><div class="whisper">drag orbit · wheel zoom · click orbs · space play · 1-4 modes · type to search bodies</div>
<div id="card" class="card" style="display:none;right:16px;top:16px;width:260px"></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();

const MINT='#9fe1cb';
const modes=[
 {id:'build',name:'BUILD',accent:'#6fa8ff'},
 {id:'sculpt',name:'SCULPT',accent:'#ff9a6a'},
 {id:'rig',name:'RIG',accent:'#6affd6'},
 {id:'marionette',name:'MARIONETTE',accent:'#d6a8ff'}
];
let mi=0,yaw=-.55,pitch=.3,zoom=1,time=0;
let camX=0,camY=0,camZ=0;
const keys={};

const bodies=['Spinous 4 arch','Lumbar 5 body','Rib 7 L','Humerus R','Femur L','Hose elbow L','Rotor bolt R1','Ankle cheek R','Tilt motor','Ab piston rod R'];
let filter='',filtering=false,selectedBody=2;

// radial tools around model: position as angle on a ring, height
const tools=[
 {id:'hull',name:'HULL',mode:'build',angle:0,height:40},
 {id:'lod',name:'LOD',mode:'build',angle:1.2,height:20},
 {id:'poly',name:'POLY',mode:'build',angle:2.4,height:60},
 {id:'paint',name:'PAINT',mode:'sculpt',angle:0,height:40},
 {id:'brush',name:'BRUSH',mode:'sculpt',angle:1.6,height:30},
 {id:'uv',name:'UV',mode:'sculpt',angle:3.0,height:50},
 {id:'rig',name:'RIG',mode:'rig',angle:0,height:40},
 {id:'ik',name:'IK',mode:'rig',angle:1.8,height:30},
 {id:'play',name:'PLAY',mode:'marionette',angle:0,height:40},
 {id:'key',name:'KEY',mode:'marionette',angle:1.5,height:30},
 {id:'curve',name:'CURVE',mode:'marionette',angle:3.2,height:50},
];

let playing=true,playhead=.35;

let hits=[];function addHit(s,c,h,o,d){hits.push({shape:s,cursor:c,hint:h,onClick:o,onDrag:d})}

addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.key>='1'&&e.key<='4')mi=+e.key-1;
 if(e.code==='Space')playing=!playing;
 if(e.code==='KeyR'){yaw=-.55;pitch=.3;zoom=1}
 if(filtering){
  if(e.code==='Escape'){filter='';filtering=false;updateCard()}
  else if(e.code==='Backspace'){filter=filter.slice(0,-1);updateCard()}
  else if(/^Key[A-Z]$/.test(e.code)||e.code==='Space'){const ch=e.code==='Space'?' ':e.code.slice(3).toLowerCase();filter+=ch;updateCard()}
 }
});
addEventListener('keyup',e=>{keys[e.code]=false});
function onWheel(e){e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom*(e.deltaY<0?1.1:.9)))}
addEventListener('wheel',onWheel,{passive:false});
let drag=false,lx=0,ly=0,activeDrag=null;
addEventListener('mousedown',e=>{
 const mx=e.clientX,my=e.clientY;lx=mx;ly=my;
 for(let i=hits.length-1;i>=0;i--){
  const h=hits[i],s=h.shape;let hit=false;
  if(s.type==='circle'){const dx=mx-s.x,dy=my-s.y;hit=dx*dx+dy*dy<=s.r*s.r}
  else if(s.type==='rect'){hit=mx>=s.x&&mx<=s.x+s.w&&my>=s.y&&my<=s.y+s.h}
  if(hit){if(h.onClick)h.onClick();if(h.onDrag){activeDrag=h.onDrag;return}return}
 }
 drag=true;
});
addEventListener('mouseup',()=>{drag=false;activeDrag=null});
addEventListener('mousemove',e=>{
 const mx=e.clientX,my=e.clientY;
 if(activeDrag){activeDrag(mx,my);lx=mx;ly=my;return}
 if(drag){yaw+=(mx-lx)*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch+(my-ly)*.006));lx=mx;ly=my;return}
});
addEventListener('contextmenu',e=>e.preventDefault());

function project(x,y,z){
 const cY=Math.cos(yaw),sY=Math.sin(yaw),cP=Math.cos(pitch),sP=Math.sin(pitch);
 const x1=x*cY-y*sY,y1=x*sY+y*cY,y2=y1*cP-z*sP,z2=y1*sP+z*cP;
 const dist=Math.max(60,560/zoom+y2*.4);const fov=560/dist;
 return{x:W*.5+x1*.0022*W*fov,y:H*.48-z2*.0022*W*fov,depth:y2,fov}
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

function draw(){
 time+=.016;hits=[];
 const st=modes[mi];
 // bg
 const bg=ctx.createRadialGradient(W*.5,H*.5,80,W*.5,H*.5,Math.max(W,H)*.7);
 bg.addColorStop(0,'#10121a');bg.addColorStop(1,'#05060a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 // floor grid (very subtle)
 ctx.strokeStyle='rgba(255,255,255,.025)';ctx.lineWidth=1;
 for(let i=-8;i<=8;i++){const a=project(i*60,0,-240),b=project(i*60,0,240);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  const c2=project(-240,0,i*60),d=project(240,0,i*60);ctx.beginPath();ctx.moveTo(c2.x,c2.y);ctx.lineTo(d.x,d.y);ctx.stroke()}

 // model
 const rings=[{x:-80,r:22},{x:-45,r:28},{x:0,r:26},{x:45,r:20},{x:80,r:14}];
 rings.forEach((rg,ri)=>{const pts=[];for(let s=0;s<14;s++){const a=s/14*Math.PI*2;pts.push(project(rg.x,Math.cos(a)*rg.r,Math.sin(a)*rg.r))}ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=ri%2?'#242832':'#1a1e28';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.stroke()});

 // radial tools orbiting the model
 const ringR=200, ringH=0;
 tools.filter(t=>t.mode===st.id).forEach(t=>{
  const ang=t.angle+time*.15;
  const x=Math.cos(ang)*ringR, z=Math.sin(ang)*ringR, y=t.height;
  const p=project(x,y,z);
  const scale=Math.max(.5,1.1-p.depth/500);
  const r=16*scale;
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
  const g=ctx.createRadialGradient(p.x-r*.3,p.y-r*.3,1,p.x,p.y,r);
  g.addColorStop(0,'#fff');g.addColorStop(.35,st.accent);g.addColorStop(1,'#0a0a0f');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=st.accent;ctx.font='bold '+(9*scale)+'px monospace';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(t.name,p.x,p.y+r+4);
  addHit({type:'circle',x:p.x,y:p.y,r:r+8},'pointer',t.name,()=>{});
 });

 // mode indicator (minimal, top center)
 ctx.fillStyle=st.accent;ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.textBaseline='top';
 ctx.fillText(st.id,W/2,18);
 ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='9px monospace';
 ctx.fillText('1 BUILD · 2 SCULPT · 3 RIG · 4 MARIONETTE',W/2,36);

 // timeline track on floor (appears as thin line)
 const trackLen=280, trackY=180;
 const ts=project(-trackLen/2,0,trackY), te=project(trackLen/2,0,trackY);
 ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ts.x,ts.y);ctx.lineTo(te.x,te.y);ctx.stroke();
 for(let i=0;i<=6;i++){const u=i/6;const p=project(-trackLen/2+u*trackLen,0,trackY);ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y-5);ctx.lineTo(p.x,p.y+5);ctx.stroke()}
 const ph=project(-trackLen/2+playhead*trackLen,0,trackY);
 ctx.strokeStyle=st.accent;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(ph.x,ph.y-12);ctx.lineTo(ph.x,ph.y+12);ctx.stroke();
 ctx.beginPath();ctx.arc(ph.x,ph.y-16,4,0,Math.PI*2);ctx.fillStyle=st.accent;ctx.fill();
 addHit({type:'circle',x:ph.x,y:ph.y,r:10},'ew-resize','Scrub',null,(mx)=>{playhead=Math.max(0,Math.min(1,playhead+(mx-lx)*.002))});
 // play button
 const pp=project(0,0,trackY+50);
 ctx.beginPath();ctx.arc(pp.x,pp.y,12,0,Math.PI*2);ctx.fillStyle=playing?st.accent:'rgba(255,255,255,.15)';ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle=playing?'#05060a':st.accent;ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(playing?'⏸':'▶',pp.x,pp.y);
 addHit({type:'circle',x:pp.x,y:pp.y,r:14},'pointer','Play/Pause',()=>{playing=!playing});

 // bottom whisper
 ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='9px monospace';ctx.textAlign='center';ctx.textBaseline='bottom';
 ctx.fillText('no panels · no toolbars · click orbs · space play · type to search bodies',W/2,H-10);

 requestAnimationFrame(draw);
}

function updateCard(){
 const card=document.getElementById('card');
 if(filtering||filter){
  card.style.display='block';
  const filt=filter.toLowerCase();
  const vis=bodies.filter(b=>!filt||b.toLowerCase().includes(filt));
  card.innerHTML='<div style="color:rgba(255,255,255,.4);font-size:9px;letter-spacing:1.5px;margin-bottom:8px">BODIES'+(filter?' /'+filter:'')+'</div>'+
   vis.map((b,i)=>'<div style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06);color:'+(i===0?'#9fe1cb':'rgba(255,255,255,.7)')+'">'+b+'</div>').join('');
 } else {
  card.style.display='none';
 }
}
// click anywhere on body list area to start filtering (top-right card)
addEventListener('mousedown',e=>{
 // if clicked empty space and not on hit, start filtering? Instead: press to focus search
},true);

// Allow typing to filter globally when not dragging
addEventListener('keydown',e=>{
 if(e.code==='Slash'){filtering=true;filter='';updateCard();e.preventDefault()}
},true);

draw();
updateCard();
</script></body></html>
