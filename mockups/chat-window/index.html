<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chest Chat Mock-up</title>
<!-- A static mock-up of the work chat inside the Geppetto chest. The chest art (art/*.png) is a
     copy of cabinet/art; sizes, colours and fonts are taken from cabinet.qml and ClaudePanel.qml.
     Nothing here talks to the real chest. -->
<style>
:root {
  --steel: #2b2f36; --steelHi: #3d424b; --steelLo: #1f2228; --edge: #0b0c0e;
  --lit: #f2a91c; --text: #c9ccd0; --dim: #7a7f88; --bad: #e0604a; --you: #9fc7e8;
  --bar: #16191c; --toolDone: #a9b4a0; --detail: #8fa3b8; --outBg: #15171b; --outText: #9aa0a8;
  --here: #5fbf6a; --gone: #6b6f75;
  --mono: "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #23262b; color: var(--text); font-family: var(--mono); }
body { min-height: 100vh; }

/* ---- the page's own switcher (not part of the chest) ---- */
#switch { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 16px; background: #121417; border-bottom: 1px solid #000; position: sticky; top: 0; z-index: 100; }
#switch .grp { display: flex; gap: 4px; align-items: center; }
#switch .lbl { color: var(--dim); font-size: 11px; margin: 0 4px 0 10px; }
.ck { font-family: var(--mono); font-weight: bold; font-size: 11px; height: 24px; padding: 0 9px; border-radius: 3px; cursor: pointer;
      background: var(--steel); color: var(--text); border: 1px solid var(--edge); }
.ck:hover { background: var(--steelHi); }
.ck.on { border: 2px solid var(--lit); color: var(--lit); }
#about { padding: 6px 16px 8px; color: var(--dim); font-size: 12px; background: #121417; border-bottom: 1px solid #000; }
#about b { color: var(--lit); }

#fit { padding: 14px 16px 30px; overflow: hidden; }
#stage { position: relative; width: 1774px; height: 760px; transform-origin: 0 0; }
img.px { image-rendering: pixelated; position: absolute; display: block; user-select: none; }

/* ---- chest: bar, frame, plates, drawers ---- */
.pxText { font-family: var(--mono); font-weight: bold; font-size: 16px; white-space: nowrap; }
#bar { position: absolute; left: 322px; top: 0; width: 1130px; height: 66px; z-index: 6; }
#nameplate { left: 20px; top: 9px; }
#nameText { position: absolute; left: 20px; top: 9px; width: 168px; height: 30px; display: grid; place-items: center; color: #eef0ea; padding-top: 2px; }
#status { position: absolute; left: 206px; top: 15px; color: #2a0608; }
#vpChip { position: absolute; right: 128px; top: 13px; }
.chip { height: 22px; padding: 0 6px; border-radius: 3px; background: var(--steelLo); border: 1px solid var(--edge); color: var(--text); font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip.lit { background: var(--lit); color: var(--steelLo); }
#btns { position: absolute; left: 1124px; top: 11px; transform: translateX(calc(-100% - 18px)); display: flex; gap: 6px; }
#btns img { position: static; }
#frame { left: 332px; top: 50px; z-index: 4; }
.plateV { z-index: 5; }
.plateText { position: absolute; z-index: 5; color: #1d2318; font-size: 16px; }
.drawer { z-index: 1; }

/* ---- the viewport inside the bezel ---- */
#view { position: absolute; left: 372px; top: 90px; width: 1024px; height: 576px; z-index: 3; overflow: hidden; background: #0e1012; }
.pane { position: absolute; overflow: hidden;
        background: radial-gradient(ellipse at 50% 38%, #3b4048 0%, #24282e 55%, #15171a 100%); }
.pane::after { content: ""; position: absolute; left: -20%; right: -20%; top: 58%; bottom: -40%;
        background-image: linear-gradient(#ffffff10 1px, transparent 1px), linear-gradient(90deg, #ffffff10 1px, transparent 1px);
        background-size: 34px 34px; transform: perspective(300px) rotateX(58deg); transform-origin: 50% 0; }
.paneHead { position: absolute; left: 0; top: 0; right: 0; height: 22px; background: var(--bar); opacity: .9; display: flex; align-items: center; gap: 6px; padding: 0 8px; z-index: 5;
        font-size: 11px; font-weight: bold; color: var(--text); white-space: nowrap; }
.paneHead.active { background: #3a2f12; color: var(--lit); }
.paneHead .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.dot { width: 8px; height: 8px; border-radius: 4px; flex: none; display: inline-block; }
.emptyPane { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #6b6f75; font-size: 12px; z-index: 2; line-height: 1.5; }
.ghost { position: absolute; z-index: 1; border: 1px dashed #5a606a; color: #6b6f75; font-size: 10px; display: grid; place-items: center; }
.ref { position: absolute; z-index: 2; background: linear-gradient(160deg, #7b6a58, #3d3530); border: 2px solid #0b0c0e; color: #e8dccb; font-size: 9px; padding: 3px; }

/* the run bar under a pane header */
.runBar { position: absolute; z-index: 5; background: var(--bar); opacity: .92; border: 1px solid #3a2f12; display: flex; align-items: center; gap: 6px; padding: 4px 8px; }
.runBar .what { color: var(--lit); font-size: 11px; font-weight: bold; white-space: nowrap; }

/* a chest Key: baked key image, optional lamp, 16px bold label */
.key { position: relative; width: 84px; height: 36px; flex: none; cursor: pointer; }
.key.s { width: 44px; }
.key img { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
.key .lamp { left: 8px; top: 9px; }
.key span { position: absolute; top: 8px; font: bold 16px var(--mono); color: var(--text); white-space: nowrap; }
.key.lit span { color: var(--lit); }
.camKeys { position: absolute; left: 10px; bottom: 6px; display: flex; gap: 4px; z-index: 5; }

/* the red error, top right, fading */
.toast { position: absolute; top: 28px; right: 10px; z-index: 50; width: 380px; padding: 8px; border-radius: 4px; background: #2a0f0c; border: 2px solid #e0604a;
       color: #ffb3a6; font: bold 12px var(--mono); animation: errfade 9s ease-in 1 forwards; }
@keyframes errfade { 0%, 75% { opacity: 1; } 100% { opacity: .0; } }

/* a picture the model looked at, popped large */
.lookPic { position: absolute; z-index: 40; background: #0b0c0eeb; border: 2px solid var(--lit); border-radius: 4px; padding: 6px; }
.lookPic .cap { color: var(--lit); font: bold 10px var(--mono); margin-bottom: 4px; }

/* ---- the chat card (ClaudePanel look) ---- */
.card { position: absolute; z-index: 20; border-radius: 4px; display: flex; flex-direction: column; padding: 5px; gap: 4px; }
.card::before { content: ""; position: absolute; inset: 0; background: var(--steelLo); opacity: .9; border: 1px solid var(--edge); border-radius: 4px; z-index: -1; }
.head { display: flex; align-items: center; gap: 5px; height: 22px; flex: none; }
.lampDot { width: 9px; height: 9px; border-radius: 5px; flex: none; }
.lampDot.work { background: var(--lit); animation: blink 1s infinite; }
.lampDot.idle { background: #7fc77a; }
.lampDot.ask { background: var(--lit); }
.lampDot.off { background: var(--dim); }
@keyframes blink { 50% { opacity: .3; } }
.title { color: var(--lit); font-weight: bold; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.keys { display: flex; gap: 3px; flex: none; }
.cardKey { min-width: 30px; height: 20px; padding: 0 5px; border-radius: 3px; background: var(--steel); border: 1px solid var(--edge); color: var(--text);
           font: bold 10px var(--mono); display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; cursor: pointer; flex: none; }
.cardKey:hover { background: var(--steelHi); }
.cardKey.hot { border: 2px solid var(--lit); color: var(--lit); }
.cardKey.danger { border: 2px solid var(--bad); color: var(--bad); }
.cardKey.off { opacity: .4; }
.cardKey.big { height: 30px; font-size: 13px; padding: 0 14px; }

/* who is talking: the model line under the head */
.modelRow { display: flex; align-items: center; gap: 4px; flex: none; position: relative; }
.picker { flex: 1; min-width: 0; height: 22px; border-radius: 3px; background: var(--steel); border: 1px solid var(--edge); display: flex; align-items: center; gap: 5px; padding: 0 6px; cursor: pointer;
          font: bold 10px var(--mono); color: var(--text); }
.picker.open { border-color: var(--lit); }
.picker .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker .via { color: var(--dim); font-weight: normal; }
.cap { font: bold 9px var(--mono); padding: 2px 4px; border-radius: 2px; white-space: nowrap; flex: none; }
.cap.tools { color: #1f2228; background: #a9b4a0; }
.cap.talk { color: var(--text); background: transparent; border: 1px solid var(--dim); }
.cap.miss { color: var(--bad); border: 1px solid var(--bad); }

/* the drop-down of everyone you can talk to */
.menu { position: absolute; z-index: 60; width: 300px; background: #16191c; border: 1px solid var(--lit); border-radius: 3px; padding: 3px; box-shadow: 0 6px 18px #000a; }
.menu .sec { color: var(--dim); font: bold 9px var(--mono); padding: 5px 5px 2px; letter-spacing: 1px; }
.menu .it { display: flex; align-items: center; gap: 6px; padding: 4px 5px; font: 10px var(--mono); color: var(--text); border-radius: 2px; }
.menu .it .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu .it.hi { background: var(--lit); color: #1f2228; }
.menu .it.hi .cap.tools { background: #1f2228; color: var(--lit); }
.menu .it.na { opacity: .45; }
.menu .foot { color: var(--dim); font: 9px var(--mono); padding: 5px; border-top: 1px solid var(--steelHi); margin-top: 3px; }

.strip { display: flex; gap: 3px; flex: none; height: 40px; overflow: hidden; }
.thumb { width: 52px; height: 40px; flex: none; border: 1px solid var(--steelHi); background: var(--edge); position: relative; overflow: hidden; }
.thumb i { position: absolute; inset: 1px; }
.thumb b { position: absolute; left: 2px; bottom: 1px; font: 8px var(--mono); color: #fff9; }

.log { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding-right: 8px; position: relative; }
.log > * { flex: none; }
.row { font-size: 11px; line-height: 1.32; word-wrap: break-word; }
.row.you { color: var(--you); }
.row.model { color: var(--text); }
.row.model b { color: #e6e8ea; }
.row.model code { color: var(--detail); }
.row.think { color: var(--dim); font-size: 9px; font-style: italic; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.row.tool { font-size: 10px; font-weight: bold; color: var(--toolDone); }
.row.tool.run { color: var(--lit); }
.row.tool.err { color: var(--bad); }
.row .detail { display: block; margin-left: 12px; color: var(--detail); font-size: 9px; font-weight: normal; word-break: break-all; }
.row.note { color: var(--dim); font-size: 10px; }
.row.who { color: var(--dim); font-size: 9px; font-weight: bold; letter-spacing: .5px; }
.out { margin-left: 12px; background: var(--outBg); border: 1px solid var(--edge); border-radius: 2px; padding: 3px 4px; color: var(--outText); font-size: 9px; white-space: pre-wrap; word-break: break-all; }
.out.err { border-color: var(--bad); color: var(--bad); }
.row.pic { display: flex; gap: 6px; align-items: center; margin-left: 12px; }
.row.pic .thumb { width: 66px; height: 50px; }
.row.pic span { color: var(--dim); font-size: 9px; }

.askRow { flex: none; background: var(--steel); border: 1px solid var(--lit); border-radius: 3px; padding: 4px 5px; }
.askRow .q { color: var(--lit); font-size: 10px; word-break: break-all; }
.askRow .k { display: flex; justify-content: flex-end; gap: 3px; margin-top: 4px; }

.input { flex: none; height: 24px; border-radius: 3px; background: var(--steel); border: 1px solid var(--edge); display: flex; align-items: center; padding: 0 3px 0 5px; }
.input .ph { flex: 1; color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* the START side: before a chat exists */
.start { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 6px 4px; }
.start h4 { margin: 0; color: var(--lit); font-size: 11px; }
.start .card2 { background: #15171b; border: 1px solid var(--edge); border-radius: 3px; padding: 6px; font-size: 10px; color: var(--text); line-height: 1.4; }
.start .card2 .k { color: var(--dim); }
.start .go { display: flex; gap: 6px; align-items: center; }
.start .hint { color: var(--dim); font-size: 9px; }
.startKey { height: 34px; padding: 0 18px; border-radius: 3px; background: var(--steel); border: 2px solid var(--lit); color: var(--lit); font: bold 14px var(--mono); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; letter-spacing: 1px; }
.startKey:hover { background: var(--steelHi); }

/* tabs (variant 3) */
.tabs { display: flex; gap: 2px; flex: none; align-items: flex-end; height: 22px; }
.tab { height: 22px; padding: 0 6px; border-radius: 3px 3px 0 0; background: var(--steelLo); border: 1px solid var(--edge); border-bottom: none; display: flex; align-items: center; gap: 4px;
       font: bold 10px var(--mono); color: var(--dim); white-space: nowrap; cursor: pointer; }
.tab.on { background: var(--steel); color: var(--lit); border-color: var(--lit); }
.tab .x { color: var(--dim); font-weight: normal; }
.tab .badge { background: var(--lit); color: #1f2228; border-radius: 2px; padding: 0 3px; font-size: 9px; }
.tab.plus { color: var(--lit); }

/* docked column (variant 2) */
.dock { position: absolute; top: 0; right: 0; bottom: 0; width: 340px; z-index: 20; background: #16191c; border-left: 2px solid #0b0c0e; display: flex; flex-direction: column; padding: 0 6px 6px; gap: 5px; }
.dock .dockHead { height: 22px; margin: 0 -6px; padding: 0 6px 0 8px; background: #3a2f12; display: flex; align-items: center; gap: 6px; color: var(--lit); font: bold 11px var(--mono); flex: none; }
.chatList { display: flex; flex-direction: column; gap: 2px; flex: none; }
.chatList .c { display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 5px; border-radius: 2px; font: bold 10px var(--mono); color: var(--text); background: var(--steelLo); border: 1px solid var(--edge); }
.chatList .c.on { border-color: var(--lit); color: var(--lit); }
.chatList .c .s { color: var(--dim); font-weight: normal; margin-left: auto; }

/* pane-tied chat (variant 4) */
.chatChip { height: 18px; padding: 0 5px; border-radius: 3px; background: var(--steel); border: 1px solid var(--edge); color: var(--text); font: bold 10px var(--mono); display: inline-flex; align-items: center; gap: 4px; flex: none; }
.chatChip.on { background: var(--lit); color: #1f2228; }
.chatChip.ask { border: 1px solid var(--lit); color: var(--lit); }
.tether { position: absolute; z-index: 19; background: var(--lit); }
.paneRing { position: absolute; z-index: 6; border: 2px solid var(--lit); pointer-events: none; }
.input input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--you); font: 11px var(--mono); }
.input input::placeholder { color: var(--dim); }
.menu .it { cursor: pointer; }
.menu .it:hover { background: var(--steelHi); }
.chatList .c, .chatChip, .row.pic, .strip .thumb, .lookPic, [data-act] { cursor: pointer; }
.toast, #frame, .plateV, .plateText, .drawer { pointer-events: none; }
.tabs { overflow: hidden; }
.tab .x:hover { color: var(--bad); }
.unfold { position: absolute; right: 0; top: 200px; width: 24px; height: 120px; z-index: 20; background: #3a2f12; color: var(--lit); font: bold 11px var(--mono);
          writing-mode: vertical-rl; display: grid; place-items: center; border: 1px solid var(--edge); }
</style>
</head>
<body>
<div id="switch">
  <div class="grp" id="variants"></div>
  <span class="lbl">STATE</span>
  <div class="grp" id="states"></div>
  <span class="lbl">SIZE</span>
  <div class="grp"><button class="ck on" data-size="fit">FIT</button><button class="ck" data-size="1">1:1</button></div>
</div>
<div id="about"></div>
<div id="fit"><div id="stage"></div></div>

<script>
// ---- everyone the chat can talk to (labels as cabinet/chat.py shows them) --------------------
const MODELS = [
  { sec: "CLAUDE CODE", items: [
    { id: "opus",   name: "Claude Opus 5.5",   short: "OPUS 5.5",   via: "Claude Code", cap: "tools", dot: "#f2a91c" },
    { id: "sonnet", name: "Claude Sonnet 5.5", short: "SONNET 5.5", via: "Claude Code", cap: "tools", dot: "#f2a91c" },
    { id: "haiku",  name: "Claude Haiku 5.5",  short: "HAIKU 5.5",  via: "Claude Code", cap: "tools", dot: "#f2a91c" },
    { id: "fable",  name: "Claude Fable 5.1",  short: "FABLE 5.1",  via: "Claude Code", cap: "tools", dot: "#f2a91c" } ] },
  { sec: "CODEX", items: [
    { id: "codex", name: "Codex", short: "CODEX", via: "Codex CLI", cap: "tools", dot: "#9fc7e8" } ] },
  { sec: "LOCAL · OLLAMA", items: [
    { id: "gchat", name: "Qwen3.5 4.5B · geppetto-chat", short: "GEPPETTO-CHAT", via: "local", cap: "tools", dot: "#7fc77a" },
    { id: "mag",   name: "mag-mell · 12B local",          short: "MAG-MELL",      via: "local", cap: "talk",  dot: "#7fc77a" } ] },
  { sec: "CLOUD", items: [
    { id: "deep",  name: "DeepSeek V4 Pro · cloud", short: "DEEPSEEK V4", via: "cloud", cap: "tools", dot: "#c79be0" },
    { id: "mini",  name: "MiniMax M3 · cloud",      short: "MINIMAX M3",  via: "cloud", cap: "miss",  dot: "#c79be0" },
    { id: "mimo",  name: "MiMo V2.6 Pro · cloud",   short: "MIMO V2.6",   via: "cloud", cap: "tools", dot: "#c79be0" } ] },
];
const M = Object.fromEntries(MODELS.flatMap(s => s.items).map(m => [m.id, m]));
const capTag = c => c === "tools" ? `<span class="cap tools">TOOLS</span>`
                  : c === "talk" ? `<span class="cap talk">TALK ONLY</span>` : `<span class="cap miss">KEY MISSING</span>`;
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// ---- the fake conversation: po asks for a mug ----------------------------------------------
const PIC = (a, b, label) => `<div class="thumb" data-act="pop"><i style="background:linear-gradient(150deg,${a},${b})"></i><b>${label}</b></div>`;
const MUG_LOG = [
  { r: "note", t: "— chat started · Opus 5.5 via Claude Code · tools on —" },
  { r: "you", t: "make me a coffee mug for the kitchen set. ~9.5 cm tall, chunky handle, glazed white" },
  { r: "think", t: "Mug: lathe body with a lip and foot ring, a bent tube for the handle. po's rule: reference photo first, into the model as a refimage. The researcher needs an OK, so ask." },
  { r: "tool", s: "done", t: "Read  ~/.claude/skills/geppetto/SKILL.md", d: "lines 1-220" },
  { r: "model", t: "Got the photo you OK'd (white diner mug, 9.6 × 8.2 cm). Building it in <b>pane 1</b> now so you can watch." },
  { r: "tool", s: "done", t: "Bash  geppetto-live build.txt - runs/mug --pace 4", d: "geppetto-live build.txt - runs/mug --pace 4" },
  { r: "out", t: "pane 1 · step 6/14  Body lathe ok  ·  Lip ok  ·  Foot ring ok\nglaze: ceramic white rough 0.22" },
  { r: "tool", s: "done", t: "Look  runs/mug/turn_03.png" },
  { r: "pic" },
  { r: "tool", s: "err", t: "Bash  effigy measure runs/mug/mug.effigy Handle", d: "effigy measure runs/mug/mug.effigy Handle" },
  { r: "out", e: true, t: "Handle: tube radius 0.4 cm is thinner than wall 0.55" },
  { r: "model", t: "The <b>handle</b> sits ~4 mm low against the photo and it's too thin. Small edit, not a rebuild: <code>set Handle radius=0.7 y=+0.4</code>." },
  { r: "tool", s: "run", t: "Bash  geppetto-live edit.txt runs/mug/mug.effigy runs/mug", d: "set Handle radius=0.7 y=+0.4 · render · save" },
];

function rowHtml(x) {
  switch (x.r) {
    case "you": return `<div class="row you">› ${x.t}</div>`;
    case "model": return `<div class="row model">${x.t}</div>`;
    case "think": return `<div class="row think">${x.t}</div>`;
    case "note": return `<div class="row note">${x.t}</div>`;
    case "tool": return `<div class="row tool ${x.s === "run" ? "run" : x.s === "err" ? "err" : ""}">${x.s === "run" ? "◐◓◑◒"[Math.floor(Date.now() / 250) % 4] : x.s === "err" ? "✗" : "✓"} ${x.t}${x.d ? `<span class="detail">${x.d}</span>` : ""}</div>`;
    case "out": return `<div class="out ${x.e ? "err" : ""}">${x.t}</div>`;
    case "pic": return `<div class="row pic" data-act="pop">${PIC("#d9d4cc", "#6b6660", "turn_03")}<span>looked at it · click to pop large</span></div>`;
  }
}

// ---- live state: the open chats and what's showing -------------------------------------------
let chats = {}, ui = {}, nextId = 1, draft = "", VAR = 0;
function resetUi(s) {
  chats = {
    mug:   { model: "opus", title: "mug", pane: 2, ask: "geppetto-live edit.txt runs/mug/mug.effigy runs/mug  (writes runs/mug/mug.effigy)", log: MUG_LOG.map(x => ({ ...x })) },
    stool: { model: "codex", title: "stool", pane: 1, busy: true, log: [
      { r: "note", t: "— chat started · Codex via Codex CLI · tools on —" },
      { r: "you", t: "three-leg milking stool, oak, 30 cm seat" },
      { r: "tool", s: "run", t: "Bash  geppetto-live build.txt - runs/stool", d: "step 3/9" } ] },
    names: { model: "mag", title: "names", log: [
      { r: "note", t: "— chat started · mag-mell · talk only —" },
      { r: "you", t: "five names for the tavern keeper" },

const later = (ms, f) => setTimeout(() => { f(); render(); }, ms);
const lastRun = c => [...c.log].reverse().find(x => x.r === "tool" && x.s === "run");

function send() {
  const el = document.getElementById("say"), t = el && el.value.trim(), c = chats[ui.active];
  if (!t || !c) return;
  draft = ""; el.value = "";
  c.log.push({ r: "you", t: esc(t) });
  if (c.title === "new chat") c.title = esc(t.split(/\s+/).slice(0, 2).join(" "));
  const m = M[c.model];
  if (m.cap === "talk") {
    c.busy = true;
    later(900, () => { c.busy = false; c.log.push({ r: "model", t: `Sure, here's my take on “${esc(t)}”. I'm talk only though: I can't run anything in the chest. SWAP to a TOOLS model to get it built.` }); });
  } else {
    c.busy = true;
    later(700, () => {
      c.log.push({ r: "think", t: `po: “${esc(t)}”. Small edit against the saved doc, not a rebuild; show it in pane ${c.pane || 1}.` });
      c.log.push({ r: "tool", s: "run", t: `Bash  geppetto-live edit.txt runs/${c.title}/${c.title}.effigy runs/${c.title}`, d: `pane ${c.pane || 1} · --pace 4` });
    });
    later(2600, () => {
      const r = lastRun(c); if (r) r.s = "done";
      c.log.push({ r: "out", t: `pane ${c.pane || 1} · edit ok · rendered · saved runs/${c.title}/${c.title}.effigy` });
      c.log.push({ r: "model", t: `Done, it's on screen in <b>pane ${c.pane || 1}</b>. Anything else?` });
      c.busy = false;
    });
  }
  render();
}

function act(a) {
  const [k, arg] = a.split(":"), c = chats[ui.active];
  switch (k) {
    case "picker": ui.picker = !ui.picker; break;
    case "pick": {
      const m = M[arg]; ui.picker = false;
      if (m.cap === "miss") { toast(`${m.name} has no API key (MINIMAX_API_KEY not set)`); break; }
      if (ui.start || !c) ui.startModel = arg;
      else if (c.model !== arg) { c.model = arg; c.log.push({ r: "note", t: `— swapped to ${m.name} · ${m.cap === "tools" ? "tools on" : "talk only"} —` }); }
      break;
    }
    case "start": {
      const id = "c" + nextId++, m = M[ui.startModel];
      chats[id] = { model: ui.startModel, title: "new chat", pane: VAR === 3 ? ui.startPane : null,
        log: [{ r: "note", t: `— chat started · ${m.name} via ${m.via} · ${m.cap === "tools" ? "tools on" : "talk only"} —` }] };
      Object.assign(ui, { active: id, start: false, closed: false, picker: false });
      setTimeout(() => document.getElementById("say")?.focus({ preventScroll: true }), 0);
      break;
    }
    case "new":
      if (VAR === 3) {
        const free = [1, 2, 3, 4].find(n => !Object.values(chats).some(x => x.pane === n));
        if (!free) { toast("no empty pane: close a chat or add a viewport"); break; }
        ui.startPane = free;
      }
      Object.assign(ui, { start: true, closed: false, picker: false }); break;
    case "startpane": Object.assign(ui, { start: true, startPane: +arg, picker: false }); break;
    case "close": if (ui.start && chats[ui.active]) ui.start = false; else ui.closed = true; ui.picker = false; break;
    case "open": Object.assign(ui, { closed: false, start: false }); break;
    case "tab": Object.assign(ui, { active: arg, start: false, closed: false, picker: false }); break;
    case "kill": delete chats[arg]; if (ui.active === arg) { ui.active = Object.keys(chats)[0]; if (!ui.active) ui.start = true; } break;
    case "fold": ui.folded = !ui.folded; break;
    case "pop": ui.pop = !ui.pop; break;
    case "send": send(); return;
    case "allow":
      if (!c) break;
      c.ask = null; c.busy = true; c.log.push({ r: "note", t: "— you allowed it —" });
      later(2000, () => {
        const r = lastRun(c); if (r) r.s = "done";
        c.log.push({ r: "out", t: `pane ${c.pane || 1} · Handle radius 0.7 y +0.4 · rendered turn_04 · saved runs/mug/mug.effigy` });
        c.log.push({ r: "model", t: "Handle's thicker now and sits where the photo has it. Look at <b>turn_04</b> and tell me if the glaze is too shiny." });
        c.busy = false;
      });
      break;
    case "deny": {
      if (!c) break;
      c.ask = null; const r = lastRun(c); if (r) r.s = "err";
      c.log.push({ r: "model", t: "OK, not running it. Want different numbers for the handle?" });
      break;
    }
    case "stop": {
      if (!c) break;
      const r = lastRun(c); if (r) r.s = "err";
      c.ask = null; c.busy = false; c.log.push({ r: "note", t: "— stopped by you —" });
      break;
    }
    case "pause":
      if (!c) break;
      c.paused = !c.paused; c.log.push({ r: "note", t: c.paused ? "— paused: it finishes this step, then waits —" : "— resumed —" });
      break;
  }
  render();
}

// ---- switcher ---------------------------------------------------------------------------------
let cur = { v: 0, s: "talk", size: "fit" }, scale = 1;
try { Object.assign(cur, JSON.parse(localStorage.getItem("chestChatMock") || "{}")); } catch (e) {}
const q = new URLSearchParams(location.search);
if (q.has("v")) cur.v = +q.get("v") - 1;
if (q.has("s")) cur.s = q.get("s");

function render() {
  VAR = cur.v;
  try { localStorage.setItem("chestChatMock", JSON.stringify(cur)); } catch (e) {}
  const say = document.getElementById("say"), focused = say && document.activeElement === say;
  if (say) draft = say.value;
  document.getElementById("variants").innerHTML = VARIANTS.map((v, i) => `<button class="ck ${i === cur.v ? "on" : ""}" data-v="${i}">${v.name}</button>`).join("");
  document.getElementById("states").innerHTML = STATES.map(([k, l]) => `<button class="ck ${k === cur.s ? "on" : ""}" data-s="${k}">${l}</button>`).join("");
  document.querySelectorAll("[data-size]").forEach(b => b.classList.toggle("on", b.dataset.size === cur.size));
  document.getElementById("about").innerHTML = VARIANTS[cur.v].about + `<br>Everything clicks: model picker, START CHAT, type + Enter, ALLOW / DENY, STOP, PAUSE, tabs, chips, X. The STATE buttons reset it.`;
  const stage = document.getElementById("stage");
  stage.innerHTML = VARIANTS[cur.v].draw(ui.start ? "start" : "talk");
  fit();
  // the model menu drops under whichever picker is showing (or above it, if it won't fit)
  const p = ui.picker && stage.querySelector(".picker"), v = stage.querySelector("#view");
  if (p) {
    const pr = p.getBoundingClientRect(), vr = v.getBoundingClientRect();
    v.insertAdjacentHTML("beforeend", menuHtml(Math.min(1024 - 304, (pr.left - vr.left) / scale), (pr.bottom - vr.top) / scale + 2));
    const m = v.lastElementChild;
    if (m.offsetTop + m.offsetHeight > 572) m.style.top = Math.max(4, (pr.top - vr.top) / scale - m.offsetHeight - 2) + "px";
  }
  const ns = document.getElementById("say");
  if (ns) { ns.value = draft; if (focused) ns.focus({ preventScroll: true }); }
}
function fit() {
  const st = document.getElementById("stage"), box = document.getElementById("fit");
  // the chest itself spans x 296..1478 of the window; show that part
  const left = 290, w = 1200;
  scale = cur.size === "fit" ? Math.min(1.4, (box.clientWidth - 32) / w) : 1;
  st.style.transform = `scale(${scale}) translateX(${-left}px)`;
  box.style.height = (760 * scale + 30) + "px";
}
document.getElementById("switch").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v) { cur.v = +b.dataset.v; resetUi(cur.s); }
  if (b.dataset.s) { cur.s = b.dataset.s; resetUi(cur.s); }
  if (b.dataset.size) cur.size = b.dataset.size;
  render();
});
document.getElementById("stage").addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (t) act(t.dataset.act);
  else if (ui.picker && !e.target.closest(".menu")) { ui.picker = false; render(); }
});
addEventListener("keydown", e => {
  if (e.target.id === "say") { if (e.key === "Enter") send(); return; }
  if (e.key === "Escape" && ui.picker) { ui.picker = false; render(); }
  if (e.key >= "1" && e.key <= "4") { cur.v = +e.key - 1; resetUi(cur.s); render(); }
});
addEventListener("resize", fit);
// focusing the input would scroll the clipped stage sideways; keep it pinned
const fitBox = document.getElementById("fit");
fitBox.addEventListener("scroll", () => { fitBox.scrollLeft = 0; fitBox.scrollTop = 0; });
// spin the ◐ on running tools
setInterval(() => { if (Object.values(chats).some(c => c.busy || lastRun(c))) document.querySelectorAll(".row.tool.run").forEach(r => r.firstChild.textContent = "◐◓◑◒"[Math.floor(Date.now() / 250) % 4] + r.firstChild.textContent.slice(1)); }, 250);
resetUi(cur.s);
render();
</script>
