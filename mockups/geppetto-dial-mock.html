<title>Geppetto in Poohdot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a fixed 1600x900 copy of the Poohdot editor, scaled to fit, with a mock-only control strip above it.
   Single dark look on purpose: it mirrors the real editor. */
:root {
  color-scheme: dark;
  --page: #08090a;
  --ink: #e6e7ea;
  --ink-dim: #9a9ea8;
  --ink-faint: #6b6f78;
  --chrome: #0c0d0f;
  --tabrow: #131417;
  --field: #1a1c21;
  --dock: #1d1f25;
  --dock-tab: #23252b;
  --panel: #1b1b1b;
  --strip: #202020;
  --strip-on: #2d2d2d;
  --sect: #282828;
  --sel: #323742;
  --accent: #2e70ea;
  --accent-soft: #294f96;
  --accent-ink: #6ea0ff;
  --warn: #f2c94c;
  --ok: #4fbf6f;
  --bad: #e5534b;
  --gep: #e8a03a;
  --mock: #f1efe9;
  --mock-ink: #1b1c1f;
  --ui: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
}
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--ui); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; box-sizing: border-box; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 1px; }

/* ---------- mock controls ---------- */
.mockbar { background: var(--mock); color: var(--mock-ink); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; max-width: 1600px; margin: 0 auto 12px; }
.mockrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.mockbar .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: #6a6458; min-width: 92px; }
.mockbar .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.mockbar button { background: #fff; border: 1px solid #d8d3c8; border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; color: var(--mock-ink); }
.mockbar button[aria-pressed="true"] { background: var(--mock-ink); color: #fff; border-color: var(--mock-ink); }
.mockbar .note { font-size: 13px; color: #3f3b35; line-height: 1.45; max-width: 110ch; }

/* ---------- scaled editor frame ---------- */
.stage { max-width: 1600px; margin: 0 auto; position: relative; }
.stage-inner { width: 1600px; height: 900px; transform-origin: 0 0; position: absolute; left: 0; top: 0; }
.ed { width: 1600px; height: 900px; background: var(--chrome); display: grid; grid-template-rows: 36px 1fr; font-size: 13px; overflow: hidden; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.5); user-select: none; position: relative; }

.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; }
.menus { display: flex; gap: 14px; }
.ws { display: flex; gap: 20px; font-weight: 600; font-size: 14px; }
.ws span { display: flex; align-items: center; gap: 5px; }
.ws span.on { color: var(--accent-ink); }
.play { display: flex; gap: 14px; justify-content: flex-end; color: var(--ink-dim); }
.play i { width: 22px; height: 22px; display: grid; place-items: center; font-style: normal; font-size: 12px; }

.body { display: grid; grid-template-columns: 236px 1fr 272px; gap: 3px; padding: 0 3px 3px; min-height: 0; }
.dock { background: var(--dock); display: grid; grid-template-rows: 28px 1fr; min-height: 0; border-radius: 3px; overflow: hidden; }
.dtabs { display: flex; align-items: stretch; background: var(--tabrow); }
.dtabs span { padding: 0 9px; display: flex; align-items: center; color: var(--ink-dim); gap: 5px; white-space: nowrap; }
.dtabs span.on { background: var(--dock-tab); color: var(--ink); }
.dtabs span.g::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gep); }
.dtabs .kebab { margin-left: auto; color: var(--ink-faint); }
.dbody { min-height: 0; overflow: hidden; }
.filter { display: flex; align-items: center; gap: 8px; padding: 6px 8px; color: var(--ink-dim); }
.filter .f { flex: 1; background: var(--field); border-radius: 3px; padding: 4px 8px; color: var(--ink-faint); font-size: 12.5px; display: flex; justify-content: space-between; }

.tree { padding: 2px 4px; }
.row { display: flex; align-items: center; gap: 6px; height: 21px; padding-left: calc(var(--d, 0) * 12px + 6px); border-radius: 3px; font-size: 13px; white-space: nowrap; }
.row.sel { background: var(--sel); }
.row.err { color: #ff8a80; }
.row .eye { margin-left: auto; color: var(--ink-dim); font-size: 11px; padding-right: 4px; }
.row .car { width: 8px; color: var(--ink-faint); font-size: 9px; }
.row .dim { color: var(--ink-faint); font-size: 11.5px; }
.subhead { padding: 8px 10px 3px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; display: flex; justify-content: space-between; }
svg.ic { width: 13px; height: 13px; flex: none; }

.center { display: grid; grid-template-rows: 28px 30px 1fr auto; min-height: 0; }
.scenetabs { display: flex; align-items: stretch; background: var(--tabrow); border-radius: 3px 3px 0 0; }
.scenetabs .t { display: flex; align-items: center; gap: 7px; padding: 0 10px; background: var(--dock-tab); color: var(--accent-ink); }
.scenetabs .t .o { width: 8px; height: 8px; border: 1.5px solid var(--bad); border-radius: 50%; }
.scenetabs .plus { padding: 0 10px; display: flex; align-items: center; color: var(--ink-dim); }
.vtool { display: flex; align-items: center; gap: 3px; padding: 0 6px; background: var(--chrome); white-space: nowrap; }
.vtool .b { display: flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 3px; }
.vtool .b.on { background: #2a2c31; }
.vtool .sep { width: 1px; height: 16px; background: #2a2c31; margin: 0 5px; }
.vtool .gsel { border: 1px solid rgba(232,160,58,.45); color: var(--gep); }

.vp { position: relative; min-height: 0; background: #191919; overflow: hidden; }
.vp canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
.vp .persp { position: absolute; left: 10px; top: 9px; background: rgba(60,62,66,.85); color: #d5d6d6; padding: 4px 9px; border-radius: 3px; }
.vp .cube { position: absolute; right: 14px; top: 12px; width: 58px; height: 58px; border: 1px solid rgba(255,255,255,.35); background: rgba(40,42,46,.7); display: grid; place-items: center; font-size: 10px; letter-spacing: .08em; color: #d5d6d6; transform: perspective(200px) rotateX(-12deg) rotateY(22deg); }
.vp .result { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; background: rgba(20,21,24,.92); border-radius: 4px; overflow: hidden; font-size: 12px; }
.vp .result span { padding: 5px 10px; border-right: 1px solid #2a2c31; color: var(--ink-dim); }
.vp .result span b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.vp .result span.ok { color: var(--ok); }
.side-tools { position: absolute; left: 0; top: 0; bottom: 0; width: 132px; background: rgba(12,13,15,.94); padding: 8px 6px; display: grid; align-content: start; gap: 2px; }
.side-tools .h { padding: 2px 6px 4px; }
.side-tools .tb { padding: 5px 8px; border-radius: 3px; display: flex; gap: 7px; align-items: center; }
.side-tools .tb.on { background: #2a2c31; }

.bottom { display: grid; grid-template-rows: 1fr 30px; background: var(--panel); height: 214px; margin-top: 3px; border-radius: 3px; overflow: hidden; }
.bstrip { display: flex; align-items: stretch; background: var(--strip); padding: 0 4px; }
.bstrip span { padding: 0 10px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.bstrip span.on { background: var(--strip-on); }
.bstrip span.g::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gep); }
.bstrip .ver { margin-left: auto; color: var(--ink-dim); }
.console { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; padding: 10px 12px; color: #d4d4d4; overflow: hidden; white-space: pre; }
.console .w { color: var(--warn); }
.fs { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
.fs .side { padding: 8px 10px; border-right: 1px solid #111; display: grid; gap: 4px; align-content: start; }
.fs .grid { display: flex; gap: 26px; padding: 14px 20px; align-items: flex-start; }
.fs .tile { display: grid; justify-items: center; gap: 8px; font-size: 12.5px; width: 84px; text-align: center; }
.fs .thumb { width: 60px; height: 52px; border-radius: 6px; display: grid; place-items: center; }

.ins-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
.ins-head .nm { flex: 1; background: var(--field); border-radius: 3px; padding: 4px 8px; display: flex; gap: 7px; align-items: center; }
.sect { background: var(--sect); text-align: center; font-weight: 600; padding: 6px; margin: 6px 4px 2px; border-radius: 3px; display: flex; justify-content: center; align-items: center; gap: 7px; }
.fold { padding: 4px 10px 4px 12px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.fold::before { content: "›"; color: var(--ink-faint); }
.prop { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 6px; padding: 3px 10px; color: var(--ink-dim); font-size: 12.5px; }
.prop .v { background: var(--field); border-radius: 3px; padding: 3px 7px; color: var(--ink); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }
.vec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.vec b { font-weight: 400; background: var(--field); border-radius: 3px; padding: 2px 5px; color: var(--ink); font-variant-numeric: tabular-nums; display: flex; gap: 4px; }
.vec b i { font-style: normal; } .vec b i.x { color: #e5534b; } .vec b i.y { color: #8bc34a; } .vec b i.z { color: #4a9cf0; }
.addc { margin: 10px; padding: 6px; text-align: center; background: var(--field); border-radius: 3px; }
.h { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }

/* ---------- Geppetto chrome (ported from the s&box version) ---------- */
.gwsbar { height: 32px; display: flex; align-items: stretch; background: #101114; padding: 0 6px; gap: 2px; }
.gwsbar .w { padding: 0 14px; display: flex; align-items: center; color: var(--ink-dim); cursor: pointer; font-weight: 500; position: relative; }
.gwsbar .w.on { color: #fff; }
.gwsbar .w.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; background: var(--gep); }
.gwsbar .div { width: 1px; background: #2a2c31; margin: 8px 6px; }
.gwsbar .trail { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--ink-dim); font-size: 12px; }
.gwsbar .trail .pill { border: 1px solid #2f3239; border-radius: 3px; padding: 2px 7px; }
.gtabs { height: 30px; display: flex; align-items: stretch; background: #15161a; padding: 0 6px; }
.gtabs .s { padding: 0 11px; display: flex; align-items: center; gap: 6px; color: var(--ink-dim); cursor: pointer; font-size: 12.5px; }
.gtabs .s .n { font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.gtabs .s.on { color: #fff; background: #1f2126; }
.gtabs .mode { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--ink-faint); font-size: 11px; letter-spacing: .08em; }
.gtabs .mode .fin { color: var(--ok); letter-spacing: 0; font-size: 12.5px; border: 1px solid rgba(79,191,111,.4); border-radius: 3px; padding: 2px 8px; }
.gtools { height: 42px; display: flex; align-items: center; gap: 4px; background: #1f2126; padding: 0 8px; white-space: nowrap; overflow: hidden; }
.gtools .tb { height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 7px; border-radius: 4px; font-size: 12.5px; }
.gtools .tb:first-child { box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.gtools .tb svg { width: 15px; height: 15px; }
.gstatus { height: 24px; background: #101114; color: var(--ink-faint); font-size: 12px; display: flex; align-items: center; padding: 0 10px; gap: 16px; }
.gstatus b { color: var(--ink-dim); font-weight: 500; }

.list { display: grid; gap: 1px; background: #15161a; border-radius: 3px; overflow: hidden; margin: 0 8px; }
.list > div { display: flex; align-items: center; gap: 7px; padding: 5px 8px; background: var(--field); white-space: nowrap; }
.list > div.sel { background: var(--sel); }
.list .r { margin-left: auto; color: var(--ink-faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.15); flex: none; }
.mats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px 8px; }
.mats div { display: grid; gap: 4px; font-size: 11px; color: var(--ink-dim); text-align: center; }
.mats i { aspect-ratio: 1; border-radius: 4px; display: block; }
.btn { background: #2a2d34; border-radius: 3px; padding: 6px 8px; margin: 4px 8px; display: flex; align-items: center; gap: 7px; justify-content: center; }
.btn.primary { background: var(--accent); color: #fff; font-weight: 600; }
.slider { display: grid; grid-template-columns: 74px 1fr 40px; gap: 6px; align-items: center; color: var(--ink-dim); padding: 4px 10px; }
.slider .tr { height: 4px; background: #33363e; border-radius: 2px; position: relative; }
.slider .tr::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--v); background: var(--accent); border-radius: 2px; }
.slider .tr::before { content: ""; position: absolute; left: calc(var(--v) - 5px); top: -4px; width: 10px; height: 12px; background: #cfd3da; border-radius: 2px; z-index: 1; }
.slider span:last-child { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }

/* timeline (Marionette) */
.tl { display: grid; grid-template-columns: 150px 1fr; min-height: 0; font-size: 12px; }
.tl .names { border-right: 1px solid #111; }
.tl .names div, .tl .lanes div { height: 22px; display: flex; align-items: center; padding: 0 10px; border-bottom: 1px solid #202226; }
.tl .lanes { position: relative; }
.tl .ruler { color: var(--ink-faint); font-variant-numeric: tabular-nums; justify-content: space-between; }
.tl .key { position: absolute; width: 8px; height: 8px; background: #e8c46a; transform: rotate(45deg); margin-top: 7px; margin-left: -4px; }
.tl .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }

/* tool placements (inside the viewport) */
.rail { position: absolute; left: 0; top: 0; bottom: 0; display: flex; z-index: 2; }
.rail .tabs { width: 86px; background: rgba(12,13,15,.95); padding: 6px 4px; display: grid; align-content: start; gap: 2px; }
.rail .tabs span { align-items: center; padding: 7px 8px; border-radius: 3px; color: var(--ink-dim); cursor: pointer; display: flex; justify-content: space-between; font-size: 12.5px; }
.rail .tabs span.on { background: #2a2c31; color: #fff; box-shadow: inset 2px 0 0 var(--gep); }
.rail .tabs span .n { color: var(--ink-faint); font-size: 10.5px; }
.rail .fly { width: 150px; background: rgba(31,33,38,.95); padding: 6px; display: grid; align-content: start; gap: 2px; border-right: 1px solid #2a2c31; }
.rail .fly .tb { padding: 6px 8px; border-radius: 3px; display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
.rail .fly .tb:first-child { background: #2a2c31; }
.rail .fly .tb svg, .shelf .tb svg { width: 14px; height: 14px; flex: none; }
.shelf { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); background: rgba(16,17,20,.95); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.45), 0 0 0 1px #2a2c31; z-index: 2; max-width: calc(100% - 40px); }
.shelf .tools { display: flex; gap: 2px; padding: 5px; flex-wrap: wrap; justify-content: center; }
.shelf .tb { padding: 6px 10px; border-radius: 4px; display: flex; gap: 7px; align-items: center; font-size: 12.5px; white-space: nowrap; }
.shelf .tb:first-child { background: #2a2c31; }
.shelf .tabs { display: flex; border-top: 1px solid #2a2c31; justify-content: center; padding: 0 4px; }
.shelf .tabs span { padding: 5px 10px; font-size: 12px; color: var(--ink-dim); cursor: pointer; }
.shelf .tabs span.on { color: #fff; box-shadow: inset 0 2px 0 var(--gep); }
.vp.withshelf .result { bottom: 8px; }
.dial { position: absolute; left: 0; bottom: 0; width: 460px; height: 460px; z-index: 2; pointer-events: none; transform-origin: 172px 300px; }
.dial .grip { cursor: grab; } .dial .grip[data-grip="size"] { cursor: nwse-resize; }
.dial .grip:hover circle { stroke: #e8a03a; }
.dial svg { pointer-events: none; overflow: visible; }
.dial svg g[data-name], .dial svg g[data-grip], .dial svg g[data-core], .dial .sh, .dial .mring > path:first-child { pointer-events: auto; }
.dial [data-name], .dial [data-core] { cursor: pointer; }
.dial .tile .wf { transition: filter .12s; }
.dial .tile:hover .wf { filter: brightness(1.28); }
.dial .pick { transition: transform .12s; transform-box: fill-box; transform-origin: center; }
.dial .pick:hover { transform: scale(1.14); }
.dial .sh:hover { stroke: #fff; stroke-width: 1.5; }
.dial .tab:hover path:first-child { filter: brightness(1.2); }
.dial .core:hover circle:first-child { stroke: #e8a03a; }
.dial .tiles.fan .tile { animation: fan .26s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 18ms); transform-box: view-box; transform-origin: 172px 300px; }
@keyframes fan { from { opacity: 0; transform: rotate(-24deg) scale(.82); } to { opacity: 1; transform: none; } }
.dial .mring.pop { animation: pop .24s cubic-bezier(.2,.8,.2,1) both; transform-box: view-box; transform-origin: 172px 300px; }
@keyframes pop { from { opacity: 0; transform: scale(.86) rotate(-8deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .dial .tiles.fan .tile, .dial .mring.pop { animation: none; } }
.dial-name { position: absolute; left: 404px; bottom: 214px; background: rgba(18,19,23,.95); border: 1px solid #2f3239; border-radius: 4px; padding: 4px 9px 4px 6px; font-size: 12px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 7px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.dial-name i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: inset -2px -2px 3px rgba(0,0,0,.4); }
.dial-name span { color: var(--ink-faint); font-family: var(--mono); font-weight: 400; font-size: 11px; }
.vp.withdial .result { left: auto; right: 14px; transform: none; }
.wheel { position: absolute; width: 300px; height: 300px; z-index: 2; pointer-events: none; }
.wheel svg { width: 100%; height: 100%; overflow: visible; }
.wheel-hint { position: absolute; left: 12px; bottom: 12px; background: rgba(16,17,20,.9); padding: 6px 10px; border-radius: 4px; font-size: 12px; color: var(--ink-dim); z-index: 2; }
.wheel-hint b { color: var(--ink); font-weight: 600; }

/* own-window placement */
.win-veil { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.win { position: absolute; left: 70px; top: 54px; right: 70px; bottom: 30px; background: var(--chrome); border-radius: 6px; box-shadow: 0 24px 70px rgba(0,0,0,.7), 0 0 0 1px #2b2e35; display: grid; grid-template-rows: 30px 26px auto 1fr 24px; overflow: hidden; }
.win .title { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #17181c; font-size: 12.5px; color: var(--ink-dim); }
.win .title b { color: var(--ink); font-weight: 600; }
.win .title .ctl { margin-left: auto; display: flex; gap: 14px; }
.win .menu { display: flex; gap: 14px; padding: 0 10px; align-items: center; font-size: 12.5px; background: var(--chrome); }
.win .wbody { display: grid; grid-template-columns: 230px 1fr 260px; grid-template-rows: 1fr 150px; gap: 3px; padding: 3px; min-height: 0; }
.win .wbody .vp { grid-column: 2; grid-row: 1; }
.win .wbody .left { grid-column: 1; grid-row: 1 / 3; }
.win .wbody .right { grid-column: 3; grid-row: 1 / 3; }
.win .wbody .wb { grid-column: 2; grid-row: 2; display: grid; grid-template-rows: 26px 1fr; background: var(--panel); border-radius: 3px; overflow: hidden; }
</style>

<div class="mockbar" role="group" aria-label="Mock controls">
  <div class="mockrow"><span class="lbl">Mock only</span>
    <div class="grp" id="placeGrp" aria-label="Where Geppetto lives">
      <button id="pA" data-p="A" aria-pressed="false">A · Its own window</button>
      <button id="pB" data-p="B" aria-pressed="true">B · Geppetto tab in the top bar</button>
      <button id="pC" data-p="C" aria-pressed="false">C · Inside the 3D view</button>
    </div>
  </div>
  <div class="mockrow" id="toolsRow"><span class="lbl">Tool buttons</span>
    <div class="grp" id="toolsGrp" aria-label="Where the tool buttons go">
      <button id="t-rows" data-t="rows" aria-pressed="false">1 · Two rows on top</button>
      <button id="t-rail" data-t="rail" aria-pressed="false">2 · Left rail</button>
      <button id="t-shelf" data-t="shelf" aria-pressed="false">3 · Bottom shelf</button>
      <button id="t-dial" data-t="dial" aria-pressed="false">4 · Viewport dial (Linework style)</button>
    </div>
  </div>
  <div class="mockrow"><span class="lbl">Workspace</span>
    <div class="grp" id="wsGrp" aria-label="Geppetto workspace"></div>
  </div>

function wireDial(root) {

    };

    <div class="tile"><div class="thumb" style="background:#2a2d34">${ICON.go.replace('class="ic"', 'class="ic" style="width:26px;height:26px"')}</div>test_room.tscn</div></div></div>`;
  const tabs = base.map(t => `<span class="${t === on ? "on" : ""}">${t}</span>`).join("") + (gep ? `<span class="g${on === "Timeline" ? " on" : ""}">Timeline</span>` : "");
  return `<div class="bottom">${content}<div class="bstrip">${tabs}<span class="ver">4.7.2.stable.mono&nbsp;&nbsp;⤒&nbsp;&nbsp;⇣</span></div></div>`;
}
function vtool(extra) {
  return `<div class="vtool"><span class="b on">⬚ Select</span><span class="b">✥ Move</span><span class="b">⟳ Rotate</span><span class="b">⤢ Scale</span><span class="sep"></span><span class="b">⬢ Local</span><span class="b">⁘ Snap</span><span class="sep"></span><span class="b">Transform</span><span class="b">View</span><span class="sep"></span><span class="b">＋ GameObject</span>${extra || ""}</div>`;
}
function sceneTabs(name) { return `<div class="scenetabs"><span class="t"><span class="o"></span>${name}<span style="color:var(--ink-dim)">✕</span></span><span class="plus">＋</span></div>`; }

/* ---------- placements ---------- */
function buildA() {
  const center = `<div class="center">${sceneTabs("test_room")}${vtool()}<div class="vp" style="background:#3e352b"></div>${bottomPanel(false)}</div>`;
  const ed = topbar(false) + `<div class="body">${leftDock("plain")}${center}${rightDock("plain")}</div>`;
  const win = `<div class="win-veil"></div><div class="win">
    <div class="title">${ICON.gep}<b>Geppetto</b> · character.effigy<span class="ctl"><span>—</span><span>▢</span><span>✕</span></span></div>
    <div class="menu"><span>File</span><span>Edit</span><span>View</span><span>Help</span></div>
    <div>${wsBar()}${stageTabs()}${toolRow()}</div>
    <div class="wbody">
      <div class="dock left"><div class="dtabs"><span class="on">${ws === "Animate" ? "Bones" : "Features"}</span>${ws === "Animate" ? "" : "<span>Variables</span>"}</div><div class="dbody">${features()}</div></div>
      ${viewport()}
      <div class="dock right"><div class="dtabs"><span class="on">${WS[ws].panel}</span>${ws === "Animate" ? "<span>Inspector</span><span>Constraints</span>" : "<span>Rig</span><span>UV</span>".replace(`<span>${WS[ws].panel}</span>`, "")}</div><div class="dbody">${wsPanel()}</div></div>
      <div class="wb"><div class="bstrip">${ws === "Animate" ? '<span class="on">Timeline</span><span>Tutorial</span>' : '<span class="on">Console</span><span>Tutorial</span>'}</div>${ws === "Animate" ? timeline() : geppettoConsole()}</div>
    </div>
    <div class="gstatus"><b>Status</b> Hover over anything and this line explains it.<span style="margin-left:auto">Undo: one history for Geppetto</span></div></div>`;
  return ed + win;
}
function buildB() {
  const head = tools === "rows" ? wsBar() + stageTabs() + toolRow() : wsBar();
  const center = `<div class="center" style="grid-template-rows:auto 1fr 24px auto"><div>${head}</div>${viewport({ toolMode: tools === "rows" ? null : tools })}<div class="gstatus"><b>Status</b> ${tools === "dial" ? "Dial: click a stage for its tools · click the middle for materials · 1–8 pick a recent material · drag its grips to move or resize it" : "Hover over anything and this line explains it."}</div>${bottomPanel(true)}</div>`;
  return topbar(true) + `<div class="body">${leftDock("gep")}${center}${rightDock("gep")}</div>`;
}
function buildC() {
  const picker = `<span class="sep"></span><span class="b gsel">${ICON.gep} ${ws} ▾</span>${WS[ws].stages.map(([n], i) => `<span class="b${i === curStage() ? " on" : ""}" data-stage="${i}" style="cursor:pointer">${n}</span>`).join("")}`;
  const center = `<div class="center">${sceneTabs("test_room")}${vtool(picker)}${viewport({ sideTools: true })}${bottomPanel(true)}</div>`;
  return topbar(false) + `<div class="body">${leftDock("gep")}${center}${rightDock("gep")}</div>`;
}

function render() {
  const ed = document.getElementById("ed");
  ed.innerHTML = place === "A" ? buildA() : place === "B" ? buildB() : buildC();
  if (place === "C") ed.querySelector(".vtool").style.overflow = "hidden";
  document.getElementById("placeNote").textContent = NOTES[place] + (place === "B" ? " " + TOOL_NOTES[tools] : "");
  document.querySelectorAll("#placeGrp button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === place));
  document.getElementById("toolsRow").hidden = place !== "B";
  document.querySelectorAll("#toolsGrp button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === tools));
  document.getElementById("wsGrp").innerHTML = WS_ORDER.map(w => `<button id="w-${w}" data-w="${w}" aria-pressed="${w === ws}">${w}</button>`).join("");
  document.querySelectorAll("#wsGrp button").forEach(b => b.addEventListener("click", () => { ws = b.dataset.w; dialOpen = -1; save(); render(); }));
  ed.querySelectorAll("[data-ws]").forEach(b => b.addEventListener("click", () => { ws = b.dataset.ws; dialOpen = -1; save(); render(); }));
  ed.querySelectorAll("[data-dstage]").forEach(g => g.addEventListener("click", () => { dialOpen = +g.dataset.dstage; animFan = true; render(); }));
  ed.querySelectorAll("[data-dback]").forEach(g => g.addEventListener("click", () => { dialOpen = -1; animFan = true; render(); }));
  ed.querySelectorAll("[data-dtool]").forEach(g => g.addEventListener("click", () => { curTool[ws] = g.dataset.dtool; render(); }));
  ed.querySelectorAll("[data-core]").forEach(g => g.addEventListener("click", () => { matOpen = !matOpen; animRing = matOpen; render(); }));
  ed.querySelectorAll("[data-mat]").forEach(g => g.addEventListener("click", () => { curMat = +g.dataset.mat; recent = [curMat].concat(recent.filter(m => m !== curMat)).slice(0, 6); render(); }));
  ed.querySelectorAll("[data-matmode]").forEach(g => g.addEventListener("click", () => { if (g.dataset.matmode !== "pick") matMode = g.dataset.matmode; render(); }));
  ed.querySelectorAll("[data-stage]").forEach(b => b.addEventListener("click", () => { stageIdx[ws] = +b.dataset.stage; render(); }));
  wireDial(ed); animFan = animRing = false;
  setupCanvas();
}
document.querySelectorAll("#placeGrp button").forEach(b => b.addEventListener("click", () => { place = b.dataset.p; save(); render(); }));
document.querySelectorAll("#toolsGrp button").forEach(b => b.addEventListener("click", () => { tools = b.dataset.t; save(); render(); }));

/* ---------- viewport drawing ---------- */
const J = { hips:[0,.95,0], spine:[0,1.18,0], chest:[0,1.38,0], neck:[0,1.55,0], head:[0,1.74,0],
  shL:[.19,1.45,0], elL:[.36,1.18,.02], haL:[.46,.94,.04], shR:[-.19,1.45,0], elR:[-.36,1.18,.02], haR:[-.46,.94,.04],
  hpL:[.1,.92,0], knL:[.12,.5,.03], ftL:[.13,.06,.06], hpR:[-.1,.92,0], knR:[-.12,.5,.03], ftR:[-.13,.06,.06] };
const WAVE = { elL:[.36,1.62,.06], haL:[.52,1.86,.1] };
const LIMBS = [["hips","chest",.17],["chest","neck",.15],["shL","elL",.065],["elL","haL",.055],["shR","elR",.065],["elR","haR",.055],["hpL","knL",.085],["knL","ftL",.07],["hpR","knR",.085],["knR","ftR",.07],["shL","shR",.08]];
const BONELINES = [["hips","spine"],["spine","chest"],["chest","neck"],["neck","head"],["chest","shL"],["shL","elL"],["elL","haL"],["chest","shR"],["shR","elR"],["elR","haR"],["hips","hpL"],["hpL","knL"],["knL","ftL"],["hips","hpR"],["hpR","knR"],["knR","ftR"]];
let cv, ctx, W, H;
function joint(k) { return ws === "Animate" && WAVE[k] ? WAVE[k] : J[k]; }
function setupCanvas() {
  cv = document.getElementById("cv"); if (!cv) return;
  ctx = cv.getContext("2d");
  const r = cv.getBoundingClientRect(), s = document.getElementById("inner").getBoundingClientRect().width / 1600;
  if (!r.width) return;
  W = r.width / s; H = r.height / s;
  const dpr = Math.min(2, (window.devicePixelRatio || 1) * Math.max(s, .5));
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let drag = null;
  cv.onpointerdown = e => { drag = e.clientX; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (drag === null) return; yaw += (e.clientX - drag) * .008; drag = e.clientX; draw(); };
  cv.onpointerup = () => { drag = null; };
  draw();
}
function proj(p) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  let x = p[0] * c + p[2] * s, z = -p[0] * s + p[2] * c, y = p[1] - 1.3;
  z -= 3.4;
  const cp = Math.cos(.18), sp = Math.sin(.18);
  const y2 = y * cp + z * sp, z2 = -y * sp + z * cp, d = -z2, f = H * 1.2;
  return [W / 2 + x / d * f, H * .5 - y2 / d * f, d];
}
function line(a, b, col, w) { const p = proj(a), q = proj(b); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); }
function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#c9cacb"); g.addColorStop(.3, "#5a5550"); g.addColorStop(.31, "#3e352b"); g.addColorStop(1, "#40362a");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = "round";
  for (let i = -8; i <= 8; i++) {
    line([i * .5, 0, -6], [i * .5, 0, 2.6], i === 0 ? "#3d8ef0" : "rgba(255,255,255,.10)", i === 0 ? 1.4 : 1);
    line([-4, 0, i * .5 - 1.5], [4, 0, i * .5 - 1.5], "rgba(255,255,255,.10)", 1);
  }
  line([-4, 0, 0], [4, 0, 0], "#e5435b", 1.4);
  const sc = proj([0, 0, 0]); ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(sc[0], sc[1], 50, 13, 0, 0, Math.PI * 2); ctx.fill();
  const showBones = ws === "Rig" || ws === "Animate", dressed = ws === "Clothing", painted = ws === "Paint";
  const parts = LIMBS.map(([a, b, r]) => ({ a, b, r, d: (proj(joint(a))[2] + proj(joint(b))[2]) / 2 })).sort((x, y) => y.d - x.d);
  for (const p of parts) {
    const pa = proj(joint(p.a)), w = p.r * 2 / pa[2] * H * 1.2;
    let col = painted ? "#c98a5a" : "#9a9da3";
    if (ws === "CAD" && p.a === "hips") col = "#a9b6cf";
    if (dressed && (p.a === "hips" || p.a === "chest" || p.a.startsWith("sh"))) col = "#b5532e";
    if (dressed && (p.a.startsWith("hp") || p.a.startsWith("kn"))) col = "#2f3b4c";
    line(joint(p.a), joint(p.b), "rgba(0,0,0,.25)", w + 2); line(joint(p.a), joint(p.b), col, w);
  }
  const hp = proj(J.head), hr = .12 / hp[2] * H * 1.2;
  ctx.fillStyle = painted ? "#d39a6a" : "#b9bcc2"; ctx.beginPath(); ctx.arc(hp[0], hp[1], hr, 0, Math.PI * 2); ctx.fill();
  if (ws === "CAD") { const t = proj(J.chest); ctx.strokeStyle = "#6ea0ff"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]); ctx.strokeRect(t[0] - 40, t[1] - 30, 80, 100); ctx.setLineDash([]); }
  if (showBones) {
    for (const [a, b] of BONELINES) { const sel = a === "shL" && b === "elL"; line(joint(a), joint(b), sel ? "#ffd27a" : "rgba(232,160,58,.9)", sel ? 3.4 : 2); }
    for (const k in J) { const p = proj(joint(k)); ctx.fillStyle = k === "shL" ? "#ffd27a" : "#e8a03a"; ctx.beginPath(); ctx.arc(p[0], p[1], 3.2, 0, Math.PI * 2); ctx.fill(); }
  }
}

function fit() {
  const st = document.getElementById("stage"), w = st.clientWidth, s = Math.min(1, w / 1600);
  document.getElementById("inner").style.transform = `scale(${s})`;
  st.style.height = 900 * s + "px";
  setupCanvas();
}
window.addEventListener("resize", fit);
render(); fit();
</script>
