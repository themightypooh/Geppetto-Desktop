  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#1e4a48" stroke-width="3"/>
  <circle cx="128" cy="96" r="104" fill="url(#lamp)"/>

  <!-- hanging lamp -->
  <line x1="128" y1="26" x2="128" y2="58" stroke="#8a6134" stroke-width="5"/>
  <path d="M108 58 L148 58 L140 76 L116 76 Z" fill="#7d5a30"/>
  <circle cx="128" cy="76" r="11" fill="#fff3d6"/>

  <!-- chat bubble -->
  <path d="M58 108 H198 A14 14 0 0 1 212 122 V172 A14 14 0 0 1 198 186 H112
