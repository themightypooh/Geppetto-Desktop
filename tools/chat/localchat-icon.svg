<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#12312f"/>
      <stop offset="55%" stop-color="#0b1f22"/>
      <stop offset="100%" stop-color="#050f12"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="34%" r="58%">
      <stop offset="0%" stop-color="#ffcf8b" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e08c3c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e08c3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b0"/>
